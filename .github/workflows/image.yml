# Builds ghcr.io/boringsql/pgmuxd on every push.
#
#   :sha-<commit>      every push — this is the one to pin
#   :<branch>          moving, for convenience
#   :vX.Y.Z            on a tag push
#
# The run summary prints the digest line to paste into a Nomad job file.

name: image

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the ldflags come from git describe

      - id: vcs
        run: |
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # From the commit, not the clock, so the same source rebuilds identically.
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

      # Derived, never hard-coded: GITHUB_TOKEN can only push to packages owned by
      # this repository's owner. Lowercased because ghcr rejects capitals and
      # this org has one.
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/pgmuxd
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.vcs.outputs.version }}
            COMMIT=${{ steps.vcs.outputs.commit }}
            BUILD_DATE=${{ steps.vcs.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: |
          {
            echo '## pgmuxd'
            echo
            echo '```'
            echo 'default = "ghcr.io/${{ steps.owner.outputs.lc }}/pgmuxd@${{ steps.build.outputs.digest }}"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
